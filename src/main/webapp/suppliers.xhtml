<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<ui:composition template="WEB-INF/templates/base.xhtml">
    <ui:define name="content">

        <div class="si-section-title">
            <i class="pi pi-truck" />
            <span>Gestión de Proveedores</span>
        </div>

        <h:form id="suppliersForm">
            <p:growl id="msgProveedores" showDetail="true" life="4000" />

            <!-- ===== Toolbar de búsqueda y acciones ===== -->
            <div class="si-glass-card" style="margin-bottom:1.5rem;">
                <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
                    <p:inputText id="search" value="#{proveedorBean.searchTerm}" placeholder="Buscar por nombre, RUC o contacto"
                                 style="flex:1;min-width:250px;">
                        <p:ajax event="keyup" listener="#{proveedorBean.searchSuppliers()}" update="tablaProveedores" delay="300" />
                    </p:inputText>

                    <p:commandButton icon="pi pi-search" title="Buscar" action="#{proveedorBean.searchSuppliers()}" update="tablaProveedores" />
                    <p:commandButton value="Nuevo Proveedor" icon="pi pi-plus"
                                     action="#{proveedorBean.prepareNewSupplier()}"
                                     process="@this"
                                     update="dialogProveedor"
                                     oncomplete="PF('dialogProveedor').show()"
                                     styleClass="p-button-rounded" />
                </div>
            </div>

            <!-- ===== Tabla de proveedores ===== -->
            <div class="si-glass-card">
                <p:dataTable id="tablaProveedores" value="#{proveedorBean.filteredSuppliers}" var="prov"
                             emptyMessage="No se encontraron proveedores."
                             rows="10" paginator="true" paginatorPosition="bottom"
                             style="width:100%">

                    <p:column headerText="RUC/DNI" width="15%">
                        <h:outputText value="#{prov.identificationNumber}" />
                    </p:column>

                    <p:column headerText="Empresa" width="25%">
                        <div style="font-weight:600;color:var(--si-text-primary);">#{prov.name}</div>
                        <div style="font-size:0.8rem;color:var(--si-text-secondary);">#{prov.razonSocial}</div>
                    </p:column>

                    <p:column headerText="Contacto" width="20%">
                        <div><i class="pi pi-user" style="font-size:0.8rem;margin-right:0.3rem;" />#{prov.contacto}</div>
                        <div style="font-size:0.85rem;color:var(--si-text-secondary);"><i class="pi pi-phone" style="font-size:0.8rem;margin-right:0.3rem;" />#{prov.phone}</div>
                    </p:column>

                    <p:column headerText="Email" width="18%">
                        <h:outputText value="#{prov.email}" />
                    </p:column>

                    <p:column headerText="Dirección" width="12%">
                        <h:outputText value="#{prov.address}" style="font-size:0.85rem;" />
                    </p:column>

                    <p:column headerText="Acciones" width="10%">
                        <p:commandButton icon="pi pi-pencil" title="Editar" styleClass="rounded-button mr-2"
                                         action="#{proveedorBean.editSupplier(prov)}" 
                                         process="@this"
                                         update="dialogProveedor" oncomplete="PF('dialogProveedor').show()" />
                        <p:commandButton icon="pi pi-trash" title="Eliminar" styleClass="rounded-button ui-button-danger"
                                         action="#{proveedorBean.deleteSupplier(prov)}" 
                                         process="@this"
                                         update="msgProveedores tablaProveedores">
                            <p:confirm header="Confirmar eliminación"
                                       message="¿Está seguro de que desea eliminar al proveedor &quot;#{prov.name}&quot;?"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>

            <!-- ===== Diálogo de confirmación global (eliminar) ===== -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="Sí, eliminar" type="button" styleClass="ui-confirmdialog-yes p-button-danger" icon="pi pi-check" />
                <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no p-button-outlined p-button-secondary" icon="pi pi-times" />
            </p:confirmDialog>

            <!-- ===== Diálogo para crear/editar proveedor ===== -->
            <p:dialog id="dialogProveedor" widgetVar="dialogProveedor" header="#{proveedorBean.selectedSupplier.idSupplier == null ? 'Nuevo Proveedor' : 'Editar Proveedor'}"
                      modal="true" closable="true" resizable="false" width="650" showEffect="fade" hideEffect="fade"
                      style="max-height:90vh;">

                <style>
                    #dialogProveedor .ui-dialog-titlebar {
                        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                        border-radius: 12px 12px 0 0;
                    }
                    #dialogProveedor .ui-inputfield:focus,
                    #dialogProveedor .ui-inputtextarea:focus {
                        border-color: #f5576c !important;
                        box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.2) !important;
                    }
                </style>

                <p:growl id="msgProveedorForm" showDetail="true" life="4000" />

                <div class="si-form-card" style="max-height:65vh;overflow-y:auto;padding-right:0.5rem;">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-noborder" columnClasses="label-column,input-column">

                        <p:outputLabel for="ruc" value="RUC/DNI:" />
                        <p:inputText id="ruc" value="#{proveedorBean.selectedSupplier.identificationNumber}" placeholder="Cédula (10) o RUC (13)" required="true" requiredMessage="Ingrese cédula o RUC" style="width:100%" maxlength="13">
                            <p:keyFilter regEx="/[0-9]/" preventPaste="false" />
                            <p:ajax event="blur" listener="#{proveedorBean.validateIdentification}" update="msgProveedorForm" process="@this" />
                        </p:inputText>

                        <p:outputLabel for="nombre" value="Nombre Comercial:" />
                        <p:inputText id="nombre" value="#{proveedorBean.selectedSupplier.name}" placeholder="Nombre de la empresa" required="true" requiredMessage="El nombre comercial es obligatorio" style="width:100%" />

                        <p:outputLabel for="razonSocial" value="Razón Social:" />
                        <p:inputText id="razonSocial" value="#{proveedorBean.selectedSupplier.razonSocial}" placeholder="Razón social completa" style="width:100%" />

                        <p:outputLabel for="contacto" value="Persona Contacto:" />
                        <p:inputText id="contacto" value="#{proveedorBean.selectedSupplier.contacto}" placeholder="Nombre del contacto" required="true" requiredMessage="La persona de contacto es obligatoria" style="width:100%" />

                        <p:outputLabel for="telefono" value="Teléfono:" />
                        <p:inputText id="telefono" value="#{proveedorBean.selectedSupplier.phone}" placeholder="Número de teléfono" required="true" requiredMessage="El teléfono es obligatorio" style="width:100%" maxlength="10">
                            <p:keyFilter regEx="/[0-9]/" />
                        </p:inputText>

                        <p:outputLabel for="email" value="Email:" />
                        <p:inputText id="email" value="#{proveedorBean.selectedSupplier.email}" placeholder="correo@empresa.com" required="true" requiredMessage="Ingrese email" style="width:100%">
                            <p:ajax event="blur" listener="#{proveedorBean.validateEmail}" update="msgEmail msgProveedorForm" process="@this" />
                        </p:inputText>
                        <p:message id="msgEmail" for="email" />

                        <p:outputLabel for="direccion" value="Dirección:" />
                        <p:inputTextarea id="direccion" value="#{proveedorBean.selectedSupplier.address}" rows="2" style="width:100%" />


                    </p:panelGrid>
                </div>

                <div style="margin-top:1.5rem;text-align:right;">
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dialogProveedor').hide()"
                                     styleClass="p-button-outlined p-button-secondary" style="margin-right:0.5rem;" />
                    <p:commandButton value="Guardar" icon="pi pi-check" action="#{proveedorBean.saveSupplier()}"
                                     update="msgProveedorForm suppliersForm:tablaProveedores" oncomplete="if(!args.validationFailed) PF('dialogProveedor').hide()" />
                </div>
            </p:dialog>

        </h:form>

    </ui:define>
</ui:composition>
</html>
