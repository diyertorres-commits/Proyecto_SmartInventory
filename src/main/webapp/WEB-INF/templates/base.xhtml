<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<h:head>
    <title>SmartInventory · Gestión de inventario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <h:outputStylesheet name="css/style.css" />
</h:head>

<h:body>
    <!-- Si una petición AJAX falla (p. ej. ViewExpiredException tras un redeploy
         o expiración real de sesión), recarga en vez de dejar el botón "muerto"
         sin ningún feedback visible para el usuario -->
    <p:ajaxStatus onerror="window.location.reload();" style="display:none;" />

    <!-- Fondo difuminado (blobs) detrás de toda la aplicación -->
    <div class="si-background">
        <div class="si-blob b1" />
        <div class="si-blob b2" />
        <div class="si-blob b3" />
    </div>

    <!-- Layout principal con sidebar -->
    <div class="si-layout">
        <!-- Sidebar de navegación -->
        <ui:include src="fragments/header.xhtml" />

        <!-- Contenido principal -->
        <div class="si-main-content">
            <!-- Banner de alerta de stock bajo -->
            <h:form id="alertaForm">
                <h:panelGroup id="bannerAlerta" rendered="#{alertaStockBean.mostrarBanner and not alertaStockBean.bannerCerrado}" 
                             style="background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 0.75rem 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1rem; border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <i class="pi pi-exclamation-triangle" style="font-size: 1rem;" />
                        <span style="font-weight: 600; font-size: 0.85rem;">#{alertaStockBean.cantidadAlertas} productos con stock bajo</span>
                    </div>
                    <p:commandButton icon="pi pi-times" action="#{alertaStockBean.cerrarBanner()}" update="alertaForm" ajax="true" process="@this"
                                   style="background: transparent; border: none; color: white; font-size: 1rem; cursor: pointer; padding: 0.25rem;" />
                </h:panelGroup>
            </h:form>

            <!-- Contenido de cada página -->
            <div class="si-page">
                <ui:insert name="content">
                    <h3>Contenido no definido</h3>
                </ui:insert>
            </div>

            <ui:include src="fragments/footer.xhtml" />
        </div>
    </div>
</h:body>

</html>
